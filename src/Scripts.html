<script>
  const App = {
    route: 'dashboard',
    initialized: false,
    params: {},
    dashboard: {},
    talents: [],
    clients: [],
    jobs: [],
    matchingSetup: null,
    matchingResults: null,
    matchingModelCriteria: [],
    vacancyCriteria: [],
    shortlists: [],
    talentPage: 1,
    talentTotalPages: 1,
    talentRequest: 0,
    loadedAt: {},
    routeRequest: 0,
    busyLongTimer: null,
    currentShortlistId: '',
    currentShortlist: null,
    currentTalentId: '',
    matchingRequest: 0,
    matchingResultRequest: 0,
    currentMatchingRunId: '',
    shortlistDetailRequest: 0,
    busyCount: 0,
    started: false
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startApp, { once: true });
  } else {
    startApp();
  }

  function startApp() {
    if (App.started) return;
    App.started = true;
    initApp();
  }

  async function initApp() {
    bindNavigation();
    bindDialogs();
    bindFilters();
    bindForms();
    bindActions();
    setBusy(true, 'Inicializando o Talent Hub…');
    try {
      const bootstrap = await server('getAppBootstrap');
      App.initialized = bootstrap.initialized;
      document.getElementById('app-version').textContent = bootstrap.version;
      document.getElementById('active-user').textContent = bootstrap.user || 'Usuário Serratec';
      document.getElementById('user-avatar').textContent = String(bootstrap.user || 'S').charAt(0).toUpperCase();
      fillConfigForm(bootstrap.config || {});

      if (!bootstrap.initialized) {
        showGlobalAlert('A estrutura do banco ainda não está completa. Confira o ID da planilha e use “Preparar banco de dados”.');
        activateRoute('integracoes');
        return;
      }

      hideGlobalAlert();
      applyReferenceData(bootstrap.parametros || {});
      if (bootstrap.dashboard) applyDashboardData(bootstrap.dashboard);
      else await loadDashboard();
      App.loadedAt.dashboard = Date.now();
    } catch (error) {
      showGlobalAlert('Não foi possível iniciar: ' + error.message);
      activateRoute('integracoes');
    } finally {
      setBusy(false);
    }
  }

  function server(method, ...args) {
    return new Promise((resolve, reject) => {
      const longRunningMethods = [
        'setupTalentHubDatabase', 'syncAll', 'syncPessoas', 'syncMatriculas',
        'regenerateTalentView', 'regenerateDashboard', 'runMatching'
      ];
      const timeoutMs = longRunningMethods.includes(method) ? 330000 : 45000;
      let settled = false;
      const timeout = setTimeout(() => {
        if (settled) return;
        settled = true;
        reject(new Error(`A operação ${method} demorou além do esperado. Tente atualizar a página.`));
      }, timeoutMs);

      const succeed = value => {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        resolve(value);
      };
      const fail = error => {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        reject(new Error(error && error.message ? error.message : String(error)));
      };

      const runner = google.script.run
        .withSuccessHandler(succeed)
        .withFailureHandler(fail);
      runner[method](...args);
    });
  }

  function bindNavigation() {
    document.querySelectorAll('[data-route]').forEach(button => {
      button.addEventListener('click', () => activateRoute(button.dataset.route));
    });
    document.querySelectorAll('[data-route-action]').forEach(button => {
      button.addEventListener('click', () => activateRoute(button.dataset.routeAction));
    });
    document.getElementById('menu-toggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
    document.getElementById('refresh-current').addEventListener('click', () => loadRoute(App.route, true));
  }

  function activateRoute(route, force) {
    App.route = route;
    document.querySelectorAll('.screen').forEach(screen => screen.classList.toggle('active', screen.id === 'screen-' + route));
    document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.route === route));
    const screen = document.getElementById('screen-' + route);
    document.getElementById('page-title').textContent = screen ? screen.dataset.title : 'Talent Hub';
    document.getElementById('sidebar').classList.remove('open');
    return loadRoute(route, force);
  }

  async function loadRoute(route, force) {
    if (!App.initialized && route !== 'integracoes') return;
    const cacheWindowMs = route === 'dashboard' ? 30000 : 60000;
    if (!force && App.loadedAt[route] && Date.now() - App.loadedAt[route] < cacheWindowMs) return;
    const requestId = ++App.routeRequest;
    const labels = {
      dashboard: 'Atualizando indicadores…',
      talentos: 'Carregando banco de talentos…',
      clientes: 'Carregando clientes…',
      vagas: 'Carregando vagas…',
      matchmaking: 'Preparando o matchmaking…',
      shortlists: 'Carregando shortlists…',
      integracoes: 'Carregando integrações…',
      audit: 'Carregando auditoria…'
    };
    setBusy(true, labels[route] || 'Carregando…');
    try {
      if (route === 'dashboard') await loadDashboard();
      if (route === 'talentos') await loadTalents();
      if (route === 'clientes') await loadClients();
      if (route === 'vagas') await loadJobs();
      if (route === 'matchmaking') await loadMatching();
      if (route === 'shortlists') await loadShortlists();
      if (route === 'integracoes') await loadIntegrations();
      if (route === 'audit') await loadAuditLogs();
      if (requestId === App.routeRequest) App.loadedAt[route] = Date.now();
    } catch (error) {
      notify(error.message, 'error');
    } finally {
      setBusy(false);
    }
  }

  async function loadReferenceData() {
    const data = await server('getParametros', ['areas_interesse', 'senioridades', 'modalidades', 'tipos_contratacao']);
    applyReferenceData(data);
  }

  function applyReferenceData(data) {
    App.params = data || {};
    fillSelect('talent-area-select', App.params.areas_interesse);
    fillSelect('talent-seniority-select', App.params.senioridades);
    fillSelect('job-seniority-select', App.params.senioridades);
    fillSelect('job-modality-select', App.params.modalidades);
    fillSelect('job-contract-select', App.params.tipos_contratacao);
  }

  function fillSelect(id, items) {
    const select = document.getElementById(id);
    if (!select) return;
    const current = select.value;
    select.innerHTML = '<option value="">Selecione</option>' + (items || []).map(item => `<option value="${escapeAttr(item.valor)}">${escapeHtml(item.valor)}</option>`).join('');
    select.value = current;
  }

  async function loadDashboard() {
    const data = await server('getDashboard');
    applyDashboardData(data);
    App.loadedAt.dashboard = Date.now();
  }

  function applyDashboardData(data) {
    App.dashboard = data.metrics || {};
    const m = App.dashboard;
    text('metric-talentos-aptos', formatNumber(m.talentos_aptos));
    text('metric-talentos-disponiveis', `${formatNumber(m.talentos_disponiveis)} disponíveis`);
    text('metric-clientes-ativos', formatNumber(m.clientes_ativos));
    text('metric-clientes-total', `${formatNumber(m.clientes_total)} cadastrados`);
    text('metric-vagas-abertas', formatNumber(m.vagas_abertas));
    text('metric-vagas-processo', `${formatNumber(m.vagas_em_processo)} em processo`);
    text('metric-contratacoes', formatNumber(m.contratacoes_ativas));
    text('metric-massa-salarial', `Massa salarial ativa: ${formatCurrency(m.massa_salarial_ativa)}`);
    text('health-cadastro', formatNumber(m.talentos_cadastro_atualizado_90d));
    text('health-termo', formatNumber(m.talentos_com_termo_ativo));
    text('health-processo', formatNumber(m.talentos_em_processo));
    text('health-bloqueados', formatNumber(m.talentos_bloqueados));
    text('health-inativos', formatNumber(m.talentos_inativos));
    text('health-inelegiveis', formatNumber(m.talentos_inelegiveis));
    text('dashboard-updated', data.atualizado_em ? `Atualizado em ${formatDateTime(data.atualizado_em)}` : 'Aguardando atualização.');
    refreshContextCards();
  }

  async function loadTalents() {
    const requestId = ++App.talentRequest;
    const filters = {
      search: document.getElementById('talentos-search').value,
      status: document.getElementById('talentos-status').value,
      page: App.talentPage,
      pageSize: 50
    };
    text('talentos-count', 'Carregando talentos…');
    document.getElementById('talentos-prev-page').disabled = true;
    document.getElementById('talentos-next-page').disabled = true;
    try {
      const data = await server('getTalentos', filters);
      if (requestId !== App.talentRequest) return;
      App.talents = data.items || [];
      App.talentPage = Number(data.page || 1);
      App.talentTotalPages = Number(data.totalPages || 1);
      text('talentos-count', `${formatNumber(data.total)} talento${data.total === 1 ? '' : 's'}`);
      text('talentos-page-label', `Página ${App.talentPage} de ${App.talentTotalPages}`);
      renderTalents(App.talents);
      App.loadedAt.talentos = Date.now();
    } finally {
      if (requestId === App.talentRequest) {
        document.getElementById('talentos-prev-page').disabled = App.talentPage <= 1;
        document.getElementById('talentos-next-page').disabled = App.talentPage >= App.talentTotalPages;
      }
    }
  }

  function renderTalents(items) {
    const body = document.getElementById('talentos-table-body');
    const empty = document.getElementById('talentos-empty');
    empty.classList.toggle('hidden', items.length > 0);
    body.innerHTML = items.map(item => `
      <tr>
        <td><div class="primary-cell"><strong>${escapeHtml(item.nome || 'Sem nome')}</strong><small>${escapeHtml(item.email || item.email_serratec || item.pessoa_id)}</small></div></td>
        <td><div class="primary-cell"><span>${escapeHtml(item.formacoes_serratec || item.curso || item.ult_formacao || 'Não informada')}</span><small>${escapeHtml(item.formacoes_serratec ? `${formatNumber(item.qtd_formacoes_serratec_aprovadas)} formação(ões) Serratec aprovada(s)` : (item.faculdade || item.escolaridade || ''))}</small></div></td>
        <td><div class="primary-cell"><span>${escapeHtml(item.area_interesse_principal || 'Área não informada')}</span><small>${escapeHtml(item.senioridade || item.principais_competencias || '')}</small></div></td>
        <td><span class="status-badge ${item.apto_talent_hub === 'SIM' ? 'status-positive' : 'status-negative'}">${item.apto_talent_hub === 'SIM' ? 'Apto' : eligibilityLabel(item.motivo_nao_apto)}</span></td>
        <td><span class="status-badge ${statusClass(item.status_pool)}">${escapeHtml(item.status_pool || '—')}</span></td>
        <td class="align-right"><button class="table-action talent-view" data-id="${escapeAttr(item.pessoa_id)}">Ver</button> <button class="table-action talent-edit" data-id="${escapeAttr(item.pessoa_id)}">Editar</button></td>
      </tr>`).join('');
  }

  async function openTalentDetail(personId) {
    setBusy(true, 'Carregando perfil…');
    try {
      const detail = await server('getTalentoById', personId);
      App.currentTalentId = personId;
      const person = detail.pessoa || {};
      document.getElementById('talent-detail-title').textContent = person.nome || 'Talento';
      const registrations = (detail.matriculas || []).map(item => escapeHtml(`${item.modalidade || 'Formação'} · ${item.ciclo || item.turma || 'sem ciclo'} · ${item.status_aluno || item.status_curso || ''}`)).join('<br>') || 'Nenhuma matrícula sincronizada.';
      document.getElementById('talent-detail-content').innerHTML = `
        <div class="detail-grid">
          ${detailItem('Pessoa ID', person.pessoa_id)}
          ${detailItem('Status no pool', `<span class="status-badge ${statusClass(person.status_pool)}">${escapeHtml(person.status_pool)}</span>`, true)}
          ${detailItem('E-mail', person.email || person.email_serratec)}
          ${detailItem('Telefone', person.celular)}
          ${detailItem('Localidade', [person.cidade, person.uf].filter(Boolean).join(' / '))}
          ${detailItem('Idade / faixa etária', [person.idade ? `${person.idade} anos` : '', person.faixa_etaria].filter(Boolean).join(' · '))}
          ${detailItem('Escolaridade', person.escolaridade || person.ult_formacao || person.ensino_medio)}
          ${detailItem('Cadastro', person.cadastro_atualizado_90d === 'SIM' ? `Válido · ${person.dias_desde_atualizacao} dias` : 'Desatualizado')}
          ${detailItem('Termo', [person.termo_status, person.termo_versao].filter(Boolean).join(' · '))}
          ${detailItem('Área / senioridade', [person.area_interesse_principal, person.senioridade].filter(Boolean).join(' · '))}
        </div>
        <div class="detail-section"><span>Competências</span><p>${escapeHtml(person.principais_competencias || 'Não informadas.')}</p></div>
        <div class="detail-section"><span>Formações Serratec aprovadas</span><p>${escapeHtml(person.formacoes_serratec || 'Nenhuma formação aprovada identificada.')}</p></div>
        <div class="detail-section"><span>Histórico de matrículas</span><p>${registrations}</p></div>
        <div class="detail-section"><span>Links profissionais</span><p>${safeLink(person.linkedin, 'LinkedIn')} ${safeLink(person.curriculo, 'Currículo')}</p></div>`;
      document.getElementById('talent-detail-dialog').showModal();
    } finally {
      setBusy(false);
    }
  }

  async function openTalentForm(personId) {
    setBusy(true, 'Preparando edição…');
    try {
      const detail = await server('getTalentoById', personId);
      const form = document.getElementById('talent-form');
      form.reset();
      fillForm(form, Object.assign({ pessoa_id: personId }, detail.talentHub || {}));
      form.elements.disponivel_para_oportunidades.checked = isYes((detail.talentHub || {}).disponivel_para_oportunidades);
      form.elements.aceita_exclusividade.checked = isYes((detail.talentHub || {}).aceita_exclusividade);
      document.getElementById('talent-form-dialog').showModal();
    } finally {
      setBusy(false);
    }
  }

  async function loadClients() {
    const data = await server('getClientes', {
      search: document.getElementById('clientes-search').value,
      status: document.getElementById('clientes-status').value
    });
    App.clients = data || [];
    text('clientes-count', `${App.clients.length} cliente${App.clients.length === 1 ? '' : 's'}`);
    renderClients(App.clients);
    populateClientSelect();
    refreshContextCards();
  }

  function renderClients(items) {
    const body = document.getElementById('clientes-table-body');
    document.getElementById('clientes-empty').classList.toggle('hidden', items.length > 0);
    body.innerHTML = items.map(item => `
      <tr>
        <td><div class="primary-cell"><strong>${escapeHtml(item.nome_empresa)}</strong><small>${escapeHtml([item.cidade, item.uf].filter(Boolean).join(' / ') || item.cnpj || '')}</small></div></td>
        <td><div class="primary-cell"><span>${escapeHtml(item.setor || 'Não informado')}</span><small>${escapeHtml(item.porte || '')}</small></div></td>
        <td>${formatNumber(item.vagas_abertas)}</td><td>${formatNumber(item.colocacoes)}</td>
        <td><span class="status-badge ${statusClass(item.status_cliente)}">${escapeHtml(item.status_cliente || '—')}</span></td>
        <td class="align-right"><button class="table-action client-edit" data-id="${escapeAttr(item.cliente_id)}">Editar</button></td>
      </tr>`).join('');
  }

  function openClientForm(clientId) {
    const form = document.getElementById('client-form');
    form.reset();
    const client = App.clients.find(item => item.cliente_id === clientId);
    document.getElementById('client-form-title').textContent = client ? 'Editar cliente' : 'Novo cliente';
    if (client) fillForm(form, client);
    document.getElementById('client-form-dialog').showModal();
  }

  async function loadJobs() {
    if (!App.clients.length) {
      App.clients = await server('getClientes', {});
      populateClientSelect();
    }
    const data = await server('getVagas', {
      search: document.getElementById('vagas-search').value,
      status: document.getElementById('vagas-status').value
    });
    App.jobs = data || [];
    text('vagas-count', `${App.jobs.length} vaga${App.jobs.length === 1 ? '' : 's'}`);
    renderJobs(App.jobs);
    refreshContextCards();
  }

  function renderJobs(items) {
    const body = document.getElementById('vagas-table-body');
    document.getElementById('vagas-empty').classList.toggle('hidden', items.length > 0);
    body.innerHTML = items.map(item => `
      <tr>
        <td><div class="primary-cell"><strong>${escapeHtml(item.titulo_vaga)}</strong><small>${escapeHtml([item.area_vaga, item.senioridade, item.modalidade].filter(Boolean).join(' · '))}</small></div></td>
        <td>${escapeHtml(item.nome_empresa || item.cliente_id)}</td>
        <td><span class="status-badge ${statusClass(item.status_vaga)}">${escapeHtml(item.status_vaga || '—')}</span></td>
        <td>${formatNumber(item.total_candidatos)}</td>
        <td>${formatSalaryRange(item.faixa_salarial_min, item.faixa_salarial_max)}</td>
        <td class="align-right"><button class="table-action job-edit" data-id="${escapeAttr(item.vaga_id)}">Editar</button></td>
      </tr>`).join('');
  }

  function openJobForm(jobId) {
    const form = document.getElementById('job-form');
    form.reset();
    form.elements.qtd_posicoes.value = 1;
    const job = App.jobs.find(item => item.vaga_id === jobId);
    const creationStatuses = ['Rascunho', 'Briefing recebido', 'Validando pool', 'Aberta'];
    const allStatuses = creationStatuses.concat(['Shortlist enviada', 'Em processo', 'Preenchida', 'Encerrada sem contratação', 'Cancelada']);
    form.elements.status_vaga.innerHTML = optionList(job ? allStatuses : creationStatuses, job ? job.status_vaga : 'Rascunho');
    document.getElementById('job-form-title').textContent = job ? 'Editar vaga' : 'Nova vaga';
    if (job) fillForm(form, job);
    document.getElementById('job-form-dialog').showModal();
  }

  function populateClientSelect() {
    const select = document.getElementById('job-client-select');
    const current = select.value;
    select.innerHTML = '<option value="">Selecione</option>' + App.clients.map(client => `<option value="${escapeAttr(client.cliente_id)}">${escapeHtml(client.nome_empresa)}</option>`).join('');
    select.value = current;
  }

  async function loadMatching(vagaId) {
    clearMatchingResults();
    const requestId = ++App.matchingRequest;
    const selectedBefore = vagaId || (document.getElementById('matching-job-select') || {}).value || '';
    const hasBaseSetup = Boolean(App.matchingSetup && Array.isArray(App.matchingSetup.vagas));
    const setup = hasBaseSetup && selectedBefore
      ? Object.assign({}, App.matchingSetup, await server('getMatchingJobContext', selectedBefore))
      : await server('getMatchingSetup', selectedBefore);
    if (requestId !== App.matchingRequest) return;
    App.matchingSetup = setup;
    const jobSelect = document.getElementById('matching-job-select');
    jobSelect.innerHTML = '<option value="">Selecione uma vaga</option>' + (setup.vagas || []).map(job => `<option value="${escapeAttr(job.vaga_id)}">${escapeHtml(job.titulo_vaga)}${job.nome_empresa ? ` · ${escapeHtml(job.nome_empresa)}` : ''}</option>`).join('');
    jobSelect.value = setup.vaga_id || selectedBefore;
    const modelSelect = document.getElementById('matching-model-select');
    const currentModel = modelSelect.value;
    const models = setup.modelos || [];
    const firstActiveModel = models.find(model => isYes(model.ativo));
    modelSelect.innerHTML = '<option value="">Selecione um modelo</option>' + models.map(model => `<option value="${escapeAttr(model.modelo_id)}">${escapeHtml(model.nome_modelo)} · v${escapeHtml(model.versao || '1.0')}${isYes(model.ativo) ? '' : ' · inativo'}</option>`).join('');
    modelSelect.value = currentModel && models.some(model => model.modelo_id === currentModel)
      ? currentModel
      : (firstActiveModel || models[0] || {}).modelo_id || '';
    App.vacancyCriteria = setup.criterios_vaga || [];
    renderMatchingCriteriaSummary();
    renderMatchingRuns(setup.execucoes || []);
  }

  function renderMatchingCriteriaSummary() {
    const container = document.getElementById('matching-criteria-summary');
    const jobId = document.getElementById('matching-job-select').value;
    const job = ((App.matchingSetup || {}).vagas || []).find(item => item.vaga_id === jobId);
    if (!job) {
      container.innerHTML = '<strong>Nenhuma vaga selecionada</strong><span>Selecione uma vaga para conferir suas regras exclusivas e prioritárias.</span>';
      return;
    }
    const criteria = App.vacancyCriteria || [];
    const activeCriteria = criteria.filter(item => valueAsBoolean(item.ativo, true));
    const inactiveCount = criteria.length - activeCriteria.length;
    const eliminatory = activeCriteria.filter(item => ['Exclusivo', 'Obrigatório'].includes(item.tipo_regra)).length;
    const weighted = activeCriteria.filter(item => ['Prioritário', 'Desejável'].includes(item.tipo_regra)).length;
    const inactiveLabel = inactiveCount ? ` · ${inactiveCount} inativo${inactiveCount === 1 ? '' : 's'}` : '';
    container.innerHTML = `<strong>${escapeHtml(job.titulo_vaga)}</strong><span>${activeCriteria.length} critério${activeCriteria.length === 1 ? '' : 's'} ativo${activeCriteria.length === 1 ? '' : 's'} · ${eliminatory} eliminatório${eliminatory === 1 ? '' : 's'} · ${weighted} com peso${inactiveLabel}.</span>`;
  }

  function renderMatchingRuns(items) {
    const list = document.getElementById('matching-run-list');
    document.getElementById('matching-runs-empty').classList.toggle('hidden', items.length > 0);
    list.innerHTML = items.map(run => `
      <button class="matching-run-card${App.matchingResults && App.matchingResults.run && App.matchingResults.run.run_id === run.run_id ? ' active' : ''}" data-run-id="${escapeAttr(run.run_id)}">
        <strong>${formatDateTime(run.executado_em)}</strong><span class="status-badge ${statusClass(run.status_run)}">${escapeHtml(run.status_run)}</span>
        <small>${formatNumber(run.total_talentos_avaliados)} avaliados · ${formatNumber(run.total_recomendados)} recomendados · modelo ${escapeHtml(run.modelo_id)}</small>
      </button>`).join('');
  }

  async function runMatchingFromUi() {
    const jobId = document.getElementById('matching-job-select').value;
    const modelId = document.getElementById('matching-model-select').value;
    const profileCount = Number(document.getElementById('matching-profile-count').value || 5);
    if (!jobId) return notify('Selecione uma vaga.', 'error');
    if (!modelId) return notify('Selecione um modelo de score.', 'error');
    const selectedModel = ((App.matchingSetup || {}).modelos || []).find(model => model.modelo_id === modelId);
    if (selectedModel && !isYes(selectedModel.ativo)) {
      return notify('Esse modelo está inativo. Abra “Ajustar modelo”, reative-o e salve antes de executar.', 'error');
    }
    setBusy(true, 'Cruzando critérios da vaga com o pool disponível…');
    try {
      const data = await server('runMatching', jobId, profileCount, modelId);
      const previousRuns = ((App.matchingSetup || {}).execucoes || []).filter(run => run.run_id !== data.run.run_id);
      App.matchingSetup = Object.assign({}, App.matchingSetup || {}, {
        vaga_id: jobId,
        execucoes: [data.run].concat(previousRuns).slice(0, 20)
      });
      renderMatchingRuns(App.matchingSetup.execucoes);
      App.matchingResults = data;
      renderMatchingResults(data);
      notify('Matchmaking concluído.');
    } catch (error) { notify(error.message, 'error'); }
    finally { setBusy(false); }
  }

  async function loadMatchingResult(runId) {
    const requestId = ++App.matchingRequest;
    const resultRequestId = ++App.matchingResultRequest;
    App.currentMatchingRunId = String(runId || '');
    setBusy(true, 'Carregando ranking…');
    try {
      const data = await server('getMatchingResults', runId);
      if (
        requestId !== App.matchingRequest ||
        resultRequestId !== App.matchingResultRequest ||
        App.currentMatchingRunId !== String(runId || '')
      ) return;
      App.matchingResults = data;
      renderMatchingResults(data);
      renderMatchingRuns((App.matchingSetup || {}).execucoes || []);
    } catch (error) {
      if (
        requestId === App.matchingRequest &&
        resultRequestId === App.matchingResultRequest &&
        App.currentMatchingRunId === String(runId || '')
      ) notify(error.message, 'error');
    }
    finally { setBusy(false); }
  }

  function renderMatchingResults(data) {
    const results = (data && data.resultados) || [];
    const run = (data && data.run) || {};
    const body = document.getElementById('matching-results-body');
    document.getElementById('matching-results-empty').classList.toggle('hidden', results.length > 0);
    document.getElementById('matching-create-shortlist-button').classList.add('hidden');
    document.getElementById('matching-select-all').checked = false;
    text('matching-results-title', data && data.vaga ? data.vaga.titulo_vaga : 'Resultado do ranking');
    text('matching-results-summary', results.length ? `${results.length} talentos avaliados · ${formatNumber(run.total_recomendados)} recomendados · ${formatDateTime(run.executado_em)}` : 'Nenhum resultado nesta execução.');
    const runAllowsSelection = run.status_run === 'Concluído';
    document.getElementById('matching-select-all').disabled = !runAllowsSelection;
    body.innerHTML = results.map(result => {
      const excluded = !!result.criterios_exclusao;
      const selectable = runAllowsSelection && result.status_resultado !== 'Selecionado para shortlist' && !excluded;
      const statusLabel = excluded
        ? 'Eliminado'
        : (result.status_resultado === 'Descartado' ? 'Abaixo do corte' : result.status_resultado);
      return `<tr>
        <td><input class="matching-result-check" type="checkbox" value="${escapeAttr(result.resultado_id)}" ${selectable ? '' : 'disabled'} aria-label="Selecionar ${escapeAttr(result.nome)}"></td>
        <td><strong>#${formatNumber(result.ordem_ranking)}</strong></td>
        <td><div class="primary-cell"><strong>${escapeHtml(result.nome || result.pessoa_id)}</strong><small>${escapeHtml([result.formacoes_serratec, result.escolaridade, result.area_interesse_principal, result.senioridade, result.cidade, result.uf].filter(Boolean).join(' · '))}</small>${result.curriculo ? `<small>${safeLink(result.curriculo, 'Abrir currículo')}</small>` : ''}</div></td>
        <td><span class="score-pill">${Number(result.score_total || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}</span></td>
        <td><div class="criteria-text">${escapeHtml(result.justificativa || 'Sem justificativa.')}<small>${result.criterios_nao_atendidos ? `Não atende: ${escapeHtml(result.criterios_nao_atendidos)}` : ''}</small></div></td>
        <td><span class="status-badge ${excluded ? 'status-negative' : statusClass(result.status_resultado)}">${escapeHtml(statusLabel)}</span></td>
      </tr>`;
    }).join('');
  }

  function clearMatchingResults() {
    App.matchingRequest += 1;
    App.matchingResultRequest += 1;
    App.currentMatchingRunId = '';
    App.matchingResults = null;
    renderMatchingResults(null);
  }

    button.classList.toggle('hidden', selected.length === 0);

  function collectVacancyCriteria() {
    return [...document.querySelectorAll('#vacancy-criteria-list .rule-row')].map((row, index) => {
      const original = App.vacancyCriteria[index] || {};
      const item = Object.assign({}, original);
      row.querySelectorAll('[data-field]').forEach(field => {
        item[field.dataset.field] = field.type === 'checkbox'
          ? (field.checked ? 'SIM' : 'NAO')
          : field.value.trim();
      });
      return item;
    });

  function matchingTalentFieldOptions(selected, allowSensitive) {
    const fields = ((App.matchingSetup || {}).campos_talento || [])
      .filter(field => allowSensitive || field.sensivel !== 'SIM');
    if (selected && !fields.some(field => field.valor === selected)) {
      fields.unshift({ valor: selected, descricao: `${selected} · campo configurado`, sensivel: 'NAO' });
    }
    return fields
      .map(field => `<option value="${escapeAttr(field.valor)}" ${field.valor === selected ? 'selected' : ''}>${escapeHtml(field.descricao)}</option>`).join('');
  }

  function matchingJobFieldOptions(selected) {
    const fields = ((App.matchingSetup || {}).campos_vaga || []).slice();
    if (selected && !fields.some(field => field.valor === selected)) {
      fields.unshift({ valor: selected, descricao: `${selected} · configuração anterior` });
    }
    return fields
      .map(field => `<option value="${escapeAttr(field.valor)}" ${field.valor === selected ? 'selected' : ''}>${escapeHtml(field.descricao)}</option>`).join('');
  }

  function optionList(values, selected) {
    return values.map(value => `<option value="${escapeAttr(value)}" ${String(value) === String(selected || '') ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('');
  }

  function openCreateShortlistDialog() {
    const selected = [...document.querySelectorAll('.matching-result-check:checked')].map(input => input.value);
    if (!selected.length || !App.matchingResults) return notify('Selecione ao menos um talento não eliminado.', 'error');
    const form = document.getElementById('create-shortlist-form');
    form.reset();
    const job = App.matchingResults.vaga || {};
    form.elements.vaga_id.value = job.vaga_id || '';
    form.elements.result_ids.value = selected.join(',');
    form.elements.rodada.value = Number(job.total_shortlists || 0) > 0
      ? Number(job.rodada_atual || 0) + 1
      : 1;
    form.elements.titulo_shortlist.value = `Shortlist — ${job.titulo_vaga || 'Vaga'} — rodada ${form.elements.rodada.value}`;
    text('create-shortlist-summary', `${selected.length} talento${selected.length === 1 ? '' : 's'} selecionado${selected.length === 1 ? '' : 's'} para ${job.titulo_vaga || 'a vaga'}.`);
    document.getElementById('create-shortlist-dialog').showModal();
  }

  async function loadShortlists(preferredId) {
    const items = await server('getShortlists', {
      search: document.getElementById('shortlists-search').value,
      status: document.getElementById('shortlists-status').value
    });
    App.shortlists = items || [];
    text('shortlists-count', `${items.length} shortlist${items.length === 1 ? '' : 's'}`);
    renderShortlistList(items);
    const targetId = preferredId || App.currentShortlistId;
    if (targetId && items.some(item => item.shortlist_id === targetId)) await openShortlistDetail(targetId, true);
    else if (items.length) await openShortlistDetail(items[0].shortlist_id, true);
    else clearShortlistDetail();
  }

  function renderShortlistList(items) {
    const container = document.getElementById('shortlist-list');
    document.getElementById('shortlists-empty').classList.toggle('hidden', items.length > 0);
    container.innerHTML = items.map(item => `
      <button class="shortlist-card${item.shortlist_id === App.currentShortlistId ? ' active' : ''}" data-shortlist-id="${escapeAttr(item.shortlist_id)}">
        <span class="shortlist-card-top"><strong>${escapeHtml(item.titulo_shortlist || item.titulo_vaga)}</strong><span class="status-badge ${statusClass(item.status_shortlist)}">${escapeHtml(item.status_shortlist)}</span></span>
        <small>${escapeHtml(item.nome_empresa || '')} · ${formatNumber(item.qtd_candidatos)} talentos · rodada ${formatNumber(item.rodada)}</small>
        <small>${formatDateTime(item.criada_em)}</small>
      </button>`).join('');
  }

  async function openShortlistDetail(shortlistId, quiet) {
    const requestId = ++App.shortlistDetailRequest;
    if (!quiet) setBusy(true, 'Carregando shortlist…');
    try {
      const data = await server('getShortlistDetails', shortlistId);
      if (requestId !== App.shortlistDetailRequest) return;
      App.currentShortlistId = shortlistId;
      App.currentShortlist = data;
      renderShortlistList(App.shortlists);
      renderShortlistDetail(data);
    } catch (error) {
      if (requestId === App.shortlistDetailRequest) notify(error.message, 'error');
    }
    finally { if (!quiet) setBusy(false); }
  }

  function clearShortlistDetail() {
    App.currentShortlistId = '';
    App.currentShortlist = null;
    document.getElementById('shortlist-detail-empty').classList.remove('hidden');
    document.getElementById('shortlist-detail-content').classList.add('hidden');
  }

  function renderShortlistDetail(data) {
    const shortlist = data.shortlist || {};
    const job = data.vaga || {};
    const client = data.cliente || {};
    document.getElementById('shortlist-detail-empty').classList.add('hidden');
    document.getElementById('shortlist-detail-content').classList.remove('hidden');
    text('shortlist-detail-company', client.nome_empresa || 'Cliente não informado');
    text('shortlist-detail-title', shortlist.titulo_shortlist || job.titulo_vaga || 'Shortlist');
    text('shortlist-detail-meta', `${job.titulo_vaga || 'Vaga'} · rodada ${shortlist.rodada || 1} · criada em ${formatDateTime(shortlist.criada_em)}`);
    const shortlistStatusSelect = document.getElementById('shortlist-detail-status');
    const allowedShortlistStatuses = [shortlist.status_shortlist].concat(shortlist.transicoes_permitidas || []);
    Array.from(shortlistStatusSelect.options).forEach(option => {
      option.disabled = !allowedShortlistStatuses.includes(option.value);
    });
    shortlistStatusSelect.value = shortlist.status_shortlist || 'Em montagem';
    const body = document.getElementById('shortlist-items-body');
    const shortlistIsTerminal = ['Concluída', 'Cancelada'].includes(shortlist.status_shortlist);
    const terminalProcessStatuses = ['Contratado', 'Recusado pela empresa', 'Recusado pelo candidato', 'Liberado', 'Substituído'];
    const terminalItemStatuses = ['Removido', 'Liberado', 'Substituído', 'Contratado'];
    body.innerHTML = (data.itens || []).map(item => {
      const process = item.processo || {};
      const processIsTerminal = terminalProcessStatuses.includes(process.status_processo);
      const canUpdate = process.status_processo === 'Contratado' ||
        (!shortlistIsTerminal && (process.transicoes_permitidas || []).length > 0);
      const canRemove = !shortlistIsTerminal &&
        !processIsTerminal &&
        !terminalItemStatuses.includes(item.status_item);
      const actions = [
        canUpdate ? `<button class="table-action process-edit" data-process-id="${escapeAttr(item.processo_id)}">Atualizar</button>` : '',
        canRemove ? `<button class="table-action shortlist-item-remove" data-item-id="${escapeAttr(item.shortlist_item_id)}">Remover</button>` : ''
      ].filter(Boolean).join(' ');
      return `<tr>
        <td><strong>#${formatNumber(item.ordem_recomendacao)}</strong></td>
        <td><div class="primary-cell"><strong>${escapeHtml(item.nome || item.pessoa_id)}</strong><small>${escapeHtml([item.area_interesse_principal, item.senioridade, item.cidade, item.uf].filter(Boolean).join(' · '))}</small></div></td>
        <td><span class="score-pill">${Number(item.score_total || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}</span></td>
        <td><div class="primary-cell"><span class="status-badge ${statusClass(process.status_processo)}">${escapeHtml(process.status_processo || '—')}</span><small>Item: ${escapeHtml(item.status_item || '—')}</small></div></td>
        <td><div class="primary-cell"><span>${process.data_envio_empresa ? `Enviado ${formatDateTime(process.data_envio_empresa)}` : 'Ainda não enviado'}</span><small>${process.data_resultado ? `Resultado ${formatDateTime(process.data_resultado)}` : ''}</small></div></td>
        <td>${actions || '—'}</td>
      </tr>`;
    }).join('');
  }

  function openProcessDialog(processId) {
    const item = (((App.currentShortlist || {}).itens) || []).find(row => row.processo_id === processId);
    if (!item) return notify('Processo não encontrado nesta shortlist.', 'error');
    const process = item.processo || {};
    const form = document.getElementById('process-form');
    form.reset();
    fillForm(form, Object.assign({}, process, item.contratacao || {}));
    form.elements.processo_id.value = processId;
    const allowedStatuses = [process.status_processo].concat(process.transicoes_permitidas || []);
    Array.from(form.elements.status_processo.options).forEach(option => {
      option.disabled = !allowedStatuses.includes(option.value);
    });
    form.elements.status_processo.value = process.status_processo || 'Pré-selecionado';
    const existingHire = !!item.contratacao;
    Array.from(form.elements.status_contratacao.options).forEach(option => {
      option.disabled = option.value === 'Substituída' ||
        (!existingHire && !['Ativa', 'Em acompanhamento'].includes(option.value));
    });
    text('process-dialog-title', `Atualizar · ${item.nome || item.pessoa_id}`);
    text('process-dialog-summary', `${item.nome || item.pessoa_id} · ${((App.currentShortlist || {}).vaga || {}).titulo_vaga || ''} · etapa atual: ${process.status_processo || '—'}.`);
    toggleHireFields();
    document.getElementById('process-dialog').showModal();
  }

  function toggleHireFields() {
    const status = document.getElementById('process-status-select').value;
    const hired = status === 'Contratado';
    document.getElementById('process-hire-fields').classList.toggle('hidden', !hired);
    document.querySelector('#process-form [name="data_contratacao"]').required = hired;
  }

  async function updateCurrentShortlistStatus() {
    if (!App.currentShortlistId) return notify('Selecione uma shortlist.', 'error');
    const newStatus = document.getElementById('shortlist-detail-status').value;
    const currentStatus = ((App.currentShortlist || {}).shortlist || {}).status_shortlist;
    if (newStatus === currentStatus) return notify('A shortlist já está nesse status.');
    setBusy(true, 'Atualizando shortlist e processos…');
    try {
      const data = await server('updateShortlistStatus', App.currentShortlistId, newStatus, {});
      App.currentShortlist = data;
      await Promise.all([loadShortlists(App.currentShortlistId), loadDashboard()]);
      notify('Status da shortlist atualizado.');
    } catch (error) { notify(error.message, 'error'); }
    finally { setBusy(false); }
  }

  async function removeCurrentShortlistItem(itemId) {
    const reason = window.prompt('Informe o motivo da remoção/liberação:') || '';
    if (!reason) return;
    setBusy(true, 'Liberando talento…');
    try {
      App.currentShortlist = await server('removeShortlistItem', itemId, { motivo: reason });
      await Promise.all([loadShortlists(App.currentShortlistId), loadDashboard()]);
      notify('Talento removido e liberado.');
    } catch (error) { notify(error.message, 'error'); }
    finally { setBusy(false); }
  }

  async function loadIntegrations() {
    const [config, status] = await Promise.all([server('getRuntimeConfig'), App.initialized ? server('getSyncStatus') : Promise.resolve({ latest: [] })]);
    fillConfigForm(config);
    renderSyncHistory(status.latest || []);
  }

  function fillConfigForm(config) {
    const form = document.getElementById('config-form');
    if (!form) return;
    Object.keys(config || {}).forEach(key => {
      if (form.elements[key]) form.elements[key].value = config[key] == null ? '' : config[key];
    });
  }

  function renderSyncHistory(items) {
    const body = document.getElementById('sync-table-body');
    document.getElementById('sync-empty').classList.toggle('hidden', items.length > 0);
    body.innerHTML = items.map(item => `<tr><td>${formatDateTime(item.iniciado_em)}</td><td>${escapeHtml(item.tipo_sync)}</td><td><span class="status-badge ${item.status === 'CONCLUIDO' ? 'status-positive' : item.status === 'ERRO' ? 'status-negative' : 'status-warning'}">${escapeHtml(item.status)}</span></td><td>${formatNumber(item.total_linhas_lidas)}</td><td>${formatNumber(item.total_linhas_gravadas)}</td><td>${escapeHtml(item.mensagem || '')}</td></tr>`).join('');
  }

  async function loadAuditLogs() {
    const items = await server('getAuditLogs', {
      search: document.getElementById('audit-search').value,
      dateFrom: document.getElementById('audit-date-from').value,
      dateTo: document.getElementById('audit-date-to').value,
      action: document.getElementById('audit-action').value,
      entity: document.getElementById('audit-entity').value,
      limit: 200
    });

  function bindFilters() {
    document.getElementById('talentos-search').addEventListener('input', debounce(() => {
      App.talentPage = 1;
      loadTalents();
    }, 500));
    document.getElementById('talentos-status').addEventListener('change', () => {
      App.talentPage = 1;
      loadTalents();
    });
    document.getElementById('clientes-search').addEventListener('input', debounce(loadClients, 300));
    document.getElementById('clientes-status').addEventListener('change', loadClients);
    document.getElementById('vagas-search').addEventListener('input', debounce(loadJobs, 300));
    document.getElementById('vagas-status').addEventListener('change', loadJobs);
    document.getElementById('shortlists-search').addEventListener('input', debounce(loadShortlists, 300));
    document.getElementById('shortlists-status').addEventListener('change', () => loadShortlists());
    document.getElementById('audit-search').addEventListener('input', debounce(loadAuditLogs, 300));
    document.getElementById('audit-date-from').addEventListener('change', loadAuditLogs);
    document.getElementById('audit-date-to').addEventListener('change', loadAuditLogs);
    document.getElementById('audit-action').addEventListener('change', loadAuditLogs);
    document.getElementById('audit-entity').addEventListener('change', loadAuditLogs);
  }

  function bindDialogs() {
    document.querySelectorAll('[data-close-dialog]').forEach(button => button.addEventListener('click', () => document.getElementById(button.dataset.closeDialog).close()));
    document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('click', event => {
      if (event.target === dialog) dialog.close();
    }));
    document.getElementById('talent-detail-edit').addEventListener('click', () => {
      document.getElementById('talent-detail-dialog').close();
      openTalentForm(App.currentTalentId);
    });
  }

  function bindActions() {
    document.getElementById('new-client-button').addEventListener('click', () => openClientForm());
    document.getElementById('new-job-button').addEventListener('click', () => openJobForm());
    document.getElementById('talentos-prev-page').addEventListener('click', () => {
      if (App.talentPage <= 1) return;
      App.talentPage -= 1;
      loadTalents();
    });
    document.getElementById('talentos-next-page').addEventListener('click', () => {
      if (App.talentPage >= App.talentTotalPages) return;
      App.talentPage += 1;
      loadTalents();
    });
    document.getElementById('talentos-table-body').addEventListener('click', event => {
      const button = event.target.closest('button[data-id]');
      if (!button) return;
      if (button.classList.contains('talent-view')) openTalentDetail(button.dataset.id);
      if (button.classList.contains('talent-edit')) openTalentForm(button.dataset.id);
    });
    document.getElementById('clientes-table-body').addEventListener('click', event => {
      const button = event.target.closest('.client-edit');
      if (button) openClientForm(button.dataset.id);
    });
    document.getElementById('vagas-table-body').addEventListener('click', event => {
      const button = event.target.closest('.job-edit');
      if (button) openJobForm(button.dataset.id);
    });

  function bindForms() {
    document.getElementById('config-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      setBusy(true, 'Salvando configuração…');
      try {
        const config = await server('saveRuntimeConfig', formToObject(form));
        fillConfigForm(config);
        notify('Configuração salva.');
      } catch (error) { notify(error.message, 'error'); }
      finally { setBusy(false); }
    });

    document.getElementById('talent-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = formToObject(form);
      payload.disponivel_para_oportunidades = form.elements.disponivel_para_oportunidades.checked ? 'SIM' : 'NAO';
      payload.aceita_exclusividade = form.elements.aceita_exclusividade.checked ? 'SIM' : 'NAO';
      setBusy(true, 'Salvando perfil…');
      try {
        await server('updateTalentoTalentHubData', payload);
        form.closest('dialog').close();
        await Promise.all([loadTalents(), loadDashboard()]);
        notify('Perfil profissional atualizado.');
      } catch (error) { notify(error.message, 'error'); }
      finally { setBusy(false); }
    });

    document.getElementById('client-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = formToObject(form);
      setBusy(true, 'Salvando cliente…');
      try {
        if (payload.cliente_id) await server('updateCliente', payload.cliente_id, payload);
        else await server('createCliente', payload);
        form.closest('dialog').close();
        await Promise.all([loadClients(), loadDashboard()]);
        notify('Cliente salvo com sucesso.');
      } catch (error) { notify(error.message, 'error'); }
      finally { setBusy(false); }
    });

    document.getElementById('job-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = formToObject(form);
      setBusy(true, 'Salvando vaga…');
      try {
        if (payload.vaga_id) await server('updateVaga', payload.vaga_id, payload);
        else await server('createVaga', payload);
        App.matchingSetup = null;
        App.loadedAt.matchmaking = 0;
        form.closest('dialog').close();
        await Promise.all([loadJobs(), loadDashboard()]);
        notify('Vaga salva com sucesso.');
      } catch (error) { notify(error.message, 'error'); }
      finally { setBusy(false); }
    });

    document.getElementById('matching-model-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = formToObject(form);
      payload.ativo = form.elements.ativo.checked ? 'SIM' : 'NAO';
      payload.normalizar_para_100 = form.elements.normalizar_para_100.checked ? 'SIM' : 'NAO';
      const criteria = collectModelCriteria();
      if (!criteria.length) return notify('Adicione ao menos um critério ao modelo.', 'error');
      setBusy(true, 'Salvando modelo de score…');
      try {
        await server('saveMatchingModel', payload, criteria);
        App.matchingSetup = null;
        form.closest('dialog').close();
        clearMatchingResults();
        await loadMatching(document.getElementById('matching-job-select').value);
        document.getElementById('matching-model-select').value = payload.modelo_id;
        notify('Modelo de score salvo.');
      } catch (error) { notify(error.message, 'error'); }
      finally { setBusy(false); }
    });

    document.getElementById('vacancy-criteria-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const jobId = form.elements.vaga_id.value;
      const criteria = collectVacancyCriteria();
      setBusy(true, 'Salvando critérios da vaga…');
      try {
        App.vacancyCriteria = await server('saveVagaCriterios', jobId, criteria);
        form.closest('dialog').close();
        clearMatchingResults();
        renderMatchingCriteriaSummary();
        notify('Critérios da vaga salvos.');
      } catch (error) { notify(error.message, 'error'); }
      finally { setBusy(false); }
    });

    document.getElementById('create-shortlist-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = formToObject(form);
      const resultIds = String(payload.result_ids || '').split(',').filter(Boolean);
      setBusy(true, 'Criando shortlist e processos…');
      try {
        const created = await server('createShortlistFromResults', payload.vaga_id, resultIds, payload);
        form.closest('dialog').close();
        notify('Shortlist criada com sucesso.');
        App.currentShortlistId = created.shortlist.shortlist_id;
        await activateRoute('shortlists', true);
      } catch (error) { notify(error.message, 'error'); }
      finally { setBusy(false); }
    });

    document.getElementById('process-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = formToObject(form);
      const processId = payload.processo_id;
      const newStatus = payload.status_processo;
      delete payload.processo_id;
      delete payload.status_processo;
      setBusy(true, 'Atualizando processo…');
      try {
        await server('updateProcessoStatus', processId, newStatus, payload);
        form.closest('dialog').close();
        await Promise.all([openShortlistDetail(App.currentShortlistId, true), loadDashboard()]);
        notify('Etapa do processo atualizada.');
      } catch (error) { notify(error.message, 'error'); }
      finally { setBusy(false); }
    });
  }

  async function setupDatabase() {
    setBusy(true, 'Preparando as abas do Talent Hub…');
    try {
      const result = await server('setupTalentHubDatabase');
      App.initialized = true;
      hideGlobalAlert();
      await loadReferenceData();
      await Promise.all([loadIntegrations(), loadDashboard()]);
      notify(result.message || 'Banco preparado.');
    } catch (error) { notify(error.message, 'error'); }
    finally { setBusy(false); }
  }

  async function runSync(method, message) {
    if (!App.initialized) return notify('Prepare o banco de dados primeiro.', 'error');
    setBusy(true, message);
    try {
      await server(method);
      await Promise.all([loadIntegrations(), loadDashboard()]);
      if (App.route === 'talentos') await loadTalents();
      notify('Sincronização concluída.');
    } catch (error) { notify(error.message, 'error'); }
    finally { setBusy(false); }
  }

  async function rebuildViews() {
    setBusy(true, 'Regenerando visões e indicadores…');
    try {
      await server('regenerateTalentView');
      await server('regenerateDashboard');
      await Promise.all([loadIntegrations(), loadDashboard()]);
      notify('Visões regeneradas.');
    } catch (error) { notify(error.message, 'error'); }
    finally { setBusy(false); }
  }

  function refreshContextCards() {
    const m = App.dashboard || {};
    text('clients-total-card', formatNumber(m.clientes_total));
    text('clients-active-card', formatNumber(m.clientes_ativos));
    text('clients-jobs-card', formatNumber(m.vagas_abertas));
    text('clients-hires-card', formatNumber(m.contratacoes_total));
    text('jobs-open-card', formatNumber(m.vagas_abertas));
    text('jobs-process-card', formatNumber(m.vagas_em_processo));
    text('jobs-candidates-card', formatNumber(m.processos_ativos));
    text('jobs-closed-card', formatNumber(m.vagas_encerradas));
  }

  function formToObject(form) {
    const object = {};
    new FormData(form).forEach((value, key) => { object[key] = typeof value === 'string' ? value.trim() : value; });
    return object;
  }

  function fillForm(form, data) {
    Object.keys(data || {}).forEach(key => {
      const field = form.elements[key];
      if (!field || field.type === 'checkbox') return;
      let value = data[key] == null ? '' : data[key];
      if (field.type === 'date' && value) value = toInputDate(value);
      field.value = value;
    });
  }

  function setBusy(active, message) {
    App.busyCount = Math.max(0, App.busyCount + (active ? 1 : -1));
    if (active && message) text('loading-message', message);
    const busy = App.busyCount > 0;
    document.getElementById('loading-overlay').classList.toggle('hidden', !busy);
    document.documentElement.classList.toggle('app-busy', busy);
    if (App.busyLongTimer) clearTimeout(App.busyLongTimer);
    App.busyLongTimer = null;
    if (busy) {
      App.busyLongTimer = setTimeout(() => {
        text('loading-message', 'Ainda processando… aguarde a conclusão antes de tentar novamente.');
      }, 7000);
    }
  }

  function notify(message, type) {
    const toast = document.createElement('div');
    toast.className = 'toast' + (type === 'error' ? ' error' : '');
    toast.textContent = message;
    document.getElementById('toast-region').appendChild(toast);
    setTimeout(() => toast.remove(), 4500);
  }

  function showGlobalAlert(message) {
    const alert = document.getElementById('global-alert');
    alert.textContent = message;
    alert.classList.remove('hidden');
  }

  function hideGlobalAlert() { document.getElementById('global-alert').classList.add('hidden'); }
  function text(id, value) { const element = document.getElementById(id); if (element) element.textContent = value == null ? '' : value; }
  function formatNumber(value) { return Number(value || 0).toLocaleString('pt-BR'); }
  function formatCurrency(value) { return Number(value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function formatSalaryRange(min, max) {
    if (min && max) return `${formatCurrency(min)} – ${formatCurrency(max)}`;
    if (min) return `A partir de ${formatCurrency(min)}`;
    if (max) return `Até ${formatCurrency(max)}`;
    return 'Não informada';
  }
  function formatDateTime(value) {
    if (!value) return '—';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? escapeHtml(String(value)) : date.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  }
  function toInputDate(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return String(value).slice(0, 10);
    return date.toISOString().slice(0, 10);
  }
  function eligibilityLabel(reason) {
    if (reason === 'CADASTRO_DESATUALIZADO') return 'Cadastro vencido';
    if (reason === 'TERMO_CANCELADO_OU_INEXISTENTE') return 'Termo pendente';
    return 'Inelegível';
  }
  function statusClass(status) {
    const value = String(status || '').toLowerCase();
    if (/(disponível|ativo|aberta|conclu|contratado|create)/.test(value)) return 'status-positive';
    if (/(processo|enviad|entrevista|update|sync)/.test(value)) return 'status-info';
    if (/(bloque|negociação|rascunho|briefing|validando|aguardando)/.test(value)) return 'status-warning';
    if (/(inelegível|cancelad|recusado|encerrad|erro)/.test(value)) return 'status-negative';
    return 'status-neutral';
  }
  function detailItem(label, value, raw) { return `<div class="detail-item"><span>${escapeHtml(label)}</span><strong>${raw ? value : escapeHtml(value || '—')}</strong></div>`; }
  function safeLink(url, label) {
    try {
      const parsedUrl = new URL(String(url));
      if (parsedUrl.protocol !== 'http:' && parsedUrl.protocol !== 'https:') return '';
      url = parsedUrl.href;
    } catch (error) { return ''; }
    return `<a href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
  }
  function isYes(value) { return ['sim', 'true', '1', 'ativo'].includes(String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()); }
  function valueAsBoolean(value, fallback) { const normalized = String(value == null ? '' : value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); return normalized ? ['sim', 'true', '1', 'ativo'].includes(normalized) : !!fallback; }
  function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char])); }
  function escapeAttr(value) { return escapeHtml(value); }
  function debounce(fn, delay) { let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); }; }
</script>
