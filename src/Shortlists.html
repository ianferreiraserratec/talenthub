<section class="screen" id="screen-shortlists" data-title="Shortlists">
  <div class="page-heading"><div><p class="eyebrow">Curadoria e processo seletivo</p><h2>Shortlists</h2><p>Acompanhe listas, envios e cada talento dentro da vaga.</p></div></div>
  <div class="panel toolbar">
    <label class="search-field"><span class="sr-only">Buscar shortlist</span><input id="shortlists-search" type="search" placeholder="Buscar por shortlist, vaga ou cliente"></label>
    <label><span class="sr-only">Status</span><select id="shortlists-status"><option>Todos</option><option>Em montagem</option><option>Enviada</option><option>Em análise pela empresa</option><option>Concluída</option><option>Cancelada</option></select></label>
    <span class="result-count" id="shortlists-count">0 shortlists</span>
  </div>
  <div class="shortlist-workspace">
    <aside class="panel shortlist-list-panel">
      <div class="panel-header"><div><h3>Listas</h3><p>Mais recentes primeiro</p></div></div>
      <div class="shortlist-list" id="shortlist-list"></div>
      <div class="empty-state compact-empty" id="shortlists-empty"><p>Nenhuma shortlist encontrada.</p></div>
    </aside>
    <div class="panel shortlist-detail-panel" id="shortlist-detail-panel">
      <div class="empty-state" id="shortlist-detail-empty"><div class="empty-icon">☷</div><h3>Selecione uma shortlist</h3><p>Os candidatos e seus processos aparecerão aqui.</p></div>
      <div class="hidden" id="shortlist-detail-content">
        <div class="shortlist-detail-header">
          <div><p class="eyebrow" id="shortlist-detail-company"></p><h3 id="shortlist-detail-title"></h3><p id="shortlist-detail-meta"></p></div>
          <div class="shortlist-status-actions">
            <select id="shortlist-detail-status"><option>Em montagem</option><option>Enviada</option><option>Em análise pela empresa</option><option>Concluída</option><option>Cancelada</option></select>
            <button class="button button-secondary" id="shortlist-save-status-button">Atualizar status</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Talento</th><th>Score</th><th>Etapa</th><th>Datas</th><th>Ações</th></tr></thead>
            <tbody id="shortlist-items-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
