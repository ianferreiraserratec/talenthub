<div class="loading-overlay hidden" id="loading-overlay" aria-live="polite" aria-busy="true">
  <div class="loader"></div><span id="loading-message">Carregando…</span>
</div>
<div class="toast-region" id="toast-region" aria-live="polite"></div>

<dialog class="modal" id="talent-detail-dialog">
  <div class="modal-header"><div><p class="eyebrow">Perfil consolidado</p><h2 id="talent-detail-title">Talento</h2></div><button class="icon-button" data-close-dialog="talent-detail-dialog" aria-label="Fechar">×</button></div>
  <div class="modal-body" id="talent-detail-content"></div>
  <div class="modal-footer"><button class="button button-ghost" data-close-dialog="talent-detail-dialog">Fechar</button><button class="button button-primary" id="talent-detail-edit">Editar dados profissionais</button></div>
</dialog>

<dialog class="modal" id="talent-form-dialog">
  <form id="talent-form">
    <div class="modal-header"><div><p class="eyebrow">Camada Talent Hub</p><h2>Editar perfil profissional</h2></div><button type="button" class="icon-button" data-close-dialog="talent-form-dialog" aria-label="Fechar">×</button></div>
    <div class="modal-body form-stack">
      <input type="hidden" name="pessoa_id">
      <div class="form-grid two-columns">
        <label><span>Momento profissional</span><input name="momento_profissional" placeholder="Ex.: buscando primeira oportunidade"></label>
        <label><span>Empresa atual</span><input name="empresa_atual"></label>
        <label><span>Área principal</span><select name="area_interesse_principal" id="talent-area-select"><option value="">Selecione</option></select></label>
        <label><span>Senioridade</span><select name="senioridade" id="talent-seniority-select"><option value="">Selecione</option></select></label>
        <label><span>Tipos de contratação</span><input name="tipo_contratacao_preferida" placeholder="CLT, PJ"></label>
        <label><span>Modalidades</span><input name="modalidade_preferida" placeholder="Remoto, Híbrido"></label>
        <label><span>Regiões de interesse</span><input name="regioes_interesse" placeholder="Petrópolis, Rio de Janeiro"></label>
        <label><span>Disponibilidade de início</span><input name="disponibilidade_inicio" placeholder="Imediata, 15 dias…"></label>
        <label><span>Pretensão mínima</span><input name="pretensao_salarial_min" type="number" min="0" step="0.01"></label>
        <label><span>Pretensão máxima</span><input name="pretensao_salarial_max" type="number" min="0" step="0.01"></label>
      </div>
      <label><span>Áreas secundárias</span><input name="areas_interesse_secundarias" placeholder="Separe por vírgulas"></label>
      <label><span>Principais competências</span><textarea name="principais_competencias" rows="3" placeholder="Java, React, SQL, Power BI…"></textarea></label>
      <div class="form-grid two-columns">
        <label><span>Portfólio</span><input name="portfolio_url" type="url"></label>
        <label><span>Currículo alternativo</span><input name="curriculo_alternativo_url" type="url"></label>
      </div>
      <div class="checkbox-grid">
        <label class="check-field"><input type="checkbox" name="disponivel_para_oportunidades"><span>Disponível para oportunidades</span></label>
        <label class="check-field"><input type="checkbox" name="aceita_exclusividade"><span>Aceita exclusividade temporária</span></label>
      </div>
      <label><span>Observações da curadoria</span><textarea name="observacoes_curadoria" rows="3"></textarea></label>
    </div>
    <div class="modal-footer"><button type="button" class="button button-ghost" data-close-dialog="talent-form-dialog">Cancelar</button><button type="submit" class="button button-primary">Salvar perfil</button></div>
  </form>
</dialog>

<dialog class="modal" id="client-form-dialog">
  <form id="client-form">
    <div class="modal-header"><div><p class="eyebrow">Relacionamento</p><h2 id="client-form-title">Novo cliente</h2></div><button type="button" class="icon-button" data-close-dialog="client-form-dialog" aria-label="Fechar">×</button></div>
    <div class="modal-body form-stack">
      <input type="hidden" name="cliente_id">
      <div class="form-grid two-columns">
        <label><span>Nome da empresa *</span><input name="nome_empresa" required></label>
        <label><span>Razão social</span><input name="razao_social"></label>
        <label><span>CNPJ</span><input name="cnpj" inputmode="numeric"></label>
        <label><span>Status</span><select name="status_cliente"><option>Prospect</option><option>Em negociação</option><option>Ativo</option><option>Inativo</option><option>Encerrado</option></select></label>
        <label><span>Tipo de cliente</span><input name="tipo_cliente" placeholder="Parceira, associada, externa…"></label>
        <label><span>Setor</span><input name="setor"></label>
        <label><span>Porte</span><select name="porte"><option value="">Selecione</option><option>Micro</option><option>Pequeno</option><option>Médio</option><option>Grande</option></select></label>
        <label><span>Cidade</span><input name="cidade"></label>
        <label><span>UF</span><input name="uf" maxlength="2"></label>
        <label><span>Site</span><input name="site" type="url"></label>
        <label><span>Responsável comercial</span><input name="responsavel_comercial"></label>
        <label><span>Prazo de retorno (dias)</span><input name="prazo_retorno_empresa_dias" type="number" min="0"></label>
      </div>
      <label><span>Observações</span><textarea name="observacoes" rows="3"></textarea></label>
    </div>
    <div class="modal-footer"><button type="button" class="button button-ghost" data-close-dialog="client-form-dialog">Cancelar</button><button type="submit" class="button button-primary">Salvar cliente</button></div>
  </form>
</dialog>

<dialog class="modal modal-wide" id="job-form-dialog">
  <form id="job-form">
    <div class="modal-header"><div><p class="eyebrow">Oportunidade</p><h2 id="job-form-title">Nova vaga</h2></div><button type="button" class="icon-button" data-close-dialog="job-form-dialog" aria-label="Fechar">×</button></div>
    <div class="modal-body form-stack">
      <input type="hidden" name="vaga_id">
      <div class="form-grid two-columns">
        <label><span>Cliente *</span><select name="cliente_id" id="job-client-select" required><option value="">Selecione</option></select></label>
        <label><span>Título da vaga *</span><input name="titulo_vaga" required></label>
        <label><span>Área</span><input name="area_vaga"></label>
        <label><span>Senioridade</span><select name="senioridade" id="job-seniority-select"><option value="">Selecione</option></select></label>
        <label><span>Status</span><select name="status_vaga"><option>Rascunho</option><option>Briefing recebido</option><option>Validando pool</option><option>Aberta</option><option>Shortlist enviada</option><option>Em processo</option><option>Preenchida</option><option>Encerrada sem contratação</option><option>Cancelada</option></select></label>
        <label><span>Quantidade de posições</span><input name="qtd_posicoes" type="number" min="1" value="1"></label>
        <label><span>Tipo de contratação</span><select name="tipo_contratacao" id="job-contract-select"><option value="">Selecione</option></select></label>
        <label><span>Modalidade</span><select name="modalidade" id="job-modality-select"><option value="">Selecione</option></select></label>
        <label><span>Cidade</span><input name="cidade"></label>
        <label><span>UF</span><input name="uf" maxlength="2"></label>
        <label><span>Salário mínimo</span><input name="faixa_salarial_min" type="number" min="0" step="0.01"></label>
        <label><span>Salário máximo</span><input name="faixa_salarial_max" type="number" min="0" step="0.01"></label>
        <label><span>Perfis previstos</span><input name="qtd_perfis_previstos" type="number" min="0"></label>
        <label><span>Responsável pela curadoria</span><input name="responsavel_curadoria"></label>
        <label><span>Briefing recebido em</span><input name="data_briefing_recebido" type="date"></label>
        <label><span>Prazo da shortlist</span><input name="prazo_envio_shortlist" type="date"></label>
      </div>
      <label><span>Descrição da vaga</span><textarea name="descricao_vaga" rows="4"></textarea></label>
      <label><span>Requisitos obrigatórios</span><textarea name="requisitos_obrigatorios" rows="3"></textarea></label>
      <label><span>Requisitos desejáveis</span><textarea name="requisitos_desejaveis" rows="3"></textarea></label>
      <label><span>Observações internas</span><textarea name="observacoes_vaga" rows="3"></textarea></label>
    </div>
    <div class="modal-footer"><button type="button" class="button button-ghost" data-close-dialog="job-form-dialog">Cancelar</button><button type="submit" class="button button-primary">Salvar vaga</button></div>
  </form>
</dialog>
