<section class="screen" id="screen-audit" data-title="Audit Logs">
  <div class="page-heading"><div><p class="eyebrow">Rastreabilidade</p><h2>Audit Logs</h2><p>Consulte alterações realizadas pela equipe e por rotinas automáticas.</p></div></div>
  <div class="toolbar panel compact-panel">
    <label class="search-field"><span class="sr-only">Buscar logs</span><input type="search" id="audit-search" placeholder="Buscar usuário, entidade, ID ou campo"></label>
    <label><span class="sr-only">Data inicial</span><input type="date" id="audit-date-from" title="Data inicial"></label>
    <label><span class="sr-only">Data final</span><input type="date" id="audit-date-to" title="Data final"></label>
    <select id="audit-action"><option value="">Todas as ações</option><option>CREATE</option><option>UPDATE</option><option>SYNC</option><option>MATCH</option><option>EXPORT</option></select>
    <select id="audit-entity"><option value="">Todas as entidades</option><option>TALENTO</option><option>CLIENTE</option><option>VAGA</option><option>CONFIG</option><option>DATABASE</option></select>
  </div>
  <div class="panel table-panel">
    <div class="table-wrap"><table><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Entidade</th><th>Alteração</th><th>Origem</th></tr></thead><tbody id="audit-table-body"></tbody></table></div>
    <div class="empty-state hidden" id="audit-empty"><div class="empty-icon">≡</div><h3>Nenhum log encontrado</h3><p>Os eventos aparecerão após o setup e as primeiras operações.</p></div>
  </div>
</section>
