<script>
  const App = {
    route: 'dashboard',
    talents: [],
    availableTalents: [],
    clients: [],
    jobs: [],
    indications: [],
    talentPage: 1,
    talentTotalPages: 1,
    talentRequest: 0,
    loadingCount: 0,
    cache: {}
  };
  const titles = { dashboard: 'Visão geral', talentos: 'Talentos', clientes: 'Clientes', vagas: 'Vagas', indicacoes: 'Indicações', audit: 'Audit Logs' };
  const $ = id => document.getElementById(id);
  const server = (name, ...args) => new Promise((resolve, reject) => {
    const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error.message || error)));
    runner[name](...args);
  });

  document.addEventListener('DOMContentLoaded', init);
  async function init() {
    document.querySelectorAll('[data-route]').forEach(button => button.addEventListener('click', () => route(button.dataset.route)));
    document.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => openDialog(button.dataset.open)));
    document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => button.closest('dialog').close()));
    $('menu-toggle').addEventListener('click', () => $('sidebar').classList.toggle('open'));
    $('refresh').addEventListener('click', () => loadRoute(App.route, 'Atualizando dados…'));
    $('talent-search').addEventListener('input', debounce(() => { App.talentPage = 1; runInline(loadTalents); }, 250));
    $('talent-status').addEventListener('change', () => { App.talentPage = 1; runInline(loadTalents); });
    $('talent-prev').addEventListener('click', () => { if (App.talentPage > 1) { App.talentPage -= 1; runInline(loadTalents); } });
    $('talent-next').addEventListener('click', () => { if (App.talentPage < App.talentTotalPages) { App.talentPage += 1; runInline(loadTalents); } });
    $('talent-form').addEventListener('submit', saveTalent); $('client-form').addEventListener('submit', saveClient); $('job-form').addEventListener('submit', saveJob); $('indication-form').addEventListener('submit', saveIndication); $('status-form').addEventListener('submit', saveStatus);
    try {
      busy(true, 'Carregando o Talent Hub…'); const state = await server('getMvpBootstrap');
      if (!state.initialized) return alertGlobal('O banco ainda não foi preparado. Use o menu “Talent Hub” da planilha operacional para preparar o MVP.');
      renderDashboard(state.dashboard);
    } catch (error) { alertGlobal(error.message); } finally { busy(false); }
  }

  async function route(name) {
    App.route = name; $('sidebar').classList.remove('open'); document.querySelectorAll('.screen').forEach(screen => screen.classList.toggle('active', screen.id === `screen-${name}`)); document.querySelectorAll('[data-route]').forEach(button => button.classList.toggle('active', button.dataset.route === name)); $('page-title').textContent = titles[name]; await loadRoute(name);
  }
  async function loadRoute(name, message) {
    busy(true, message || `Carregando ${titles[name].toLowerCase()}…`);
    try {
      if (name === 'dashboard') await loadDashboard();
      else if (name === 'talentos') await loadTalents();
      else if (name === 'clientes') await loadClients();
      else if (name === 'vagas') await loadJobs();
      else if (name === 'indicacoes') await loadIndications();
      else if (name === 'audit') await loadAudit();
    } catch (error) { restoreRoute(name); toast(error.message, true); } finally { busy(false); }
  }
  async function loadDashboard() {
    renderDashboard(await server('getDashboard'));
  }
  function renderDashboard(data) {
    const labels = { talentos_aptos: 'Talentos aptos', talentos_disponiveis: 'Disponíveis', clientes_ativos: 'Clientes ativos', vagas_abertas: 'Vagas abertas', indicacoes_ativas: 'Indicações em andamento', contratacoes: 'Contratações' };
    const accents = ['accent-blue', 'accent-cyan', 'accent-violet', 'accent-green'];
    $('dashboard-metrics').innerHTML = Object.entries(labels).map(([key, label], index) => `<article class="metric-card ${accents[index % accents.length]}"><span class="metric-label">${label}</span><strong class="metric-value">${Number(data.metrics[key] || 0).toLocaleString('pt-BR')}</strong></article>`).join('');
  }
  async function loadTalents() {
    const request = ++App.talentRequest;
    tableBusy('talents-body', 'Buscando talentos…');
    const data = await server('mvpGetTalents', { search: $('talent-search').value, status: $('talent-status').value, page: App.talentPage, pageSize: 50 });
    if (request !== App.talentRequest) return;
    App.talents = data.items; App.talentPage = data.page; App.talentTotalPages = data.totalPages;
    $('talent-count').textContent = `${data.total.toLocaleString('pt-BR')} talentos`;
    $('talent-page-label').textContent = `Página ${data.page} de ${data.totalPages}`;
    $('talent-prev').disabled = data.page <= 1; $('talent-next').disabled = data.page >= data.totalPages;
    renderTalents();
  }
  function renderTalents() {
    $('talents-body').innerHTML = App.talents.length ? App.talents.map(row => `<tr><td><div class="primary-cell"><strong>${e(row.nome)}</strong><small>${e(row.email || row.email_serratec)}</small></div></td><td>${e(row.curso || row.ult_formacao || '—')}</td><td><div class="primary-cell"><span>${e(row.area_interesse_principal || 'Não informado')}</span><small>${e(row.principais_competencias || '')}</small></div></td><td><span class="status-badge ${statusClass(row.status_pool)}">${e(row.status_pool)}</span></td><td class="align-right"><button class="button button-ghost" onclick="editTalent('${a(row.pessoa_id)}')">Editar</button></td></tr>`).join('') : empty('Nenhum talento encontrado.');
  }
  async function loadClients() {
    tableBusy('clients-body', 'Carregando clientes…');
    App.clients = await server('mvpGetClients');
    App.cache.clients = Date.now();
    renderClients();
  }
  function renderClients() {
    $('clients-body').innerHTML = App.clients.length ? App.clients.map(row => {
      const contact = row.contato_principal || {};
      return `<tr><td><div class="primary-cell"><strong>${e(row.nome_empresa)}</strong><small>${e(row.cidade || '')}${row.uf ? ' / ' + e(row.uf) : ''}</small></div></td><td><span class="status-badge ${statusClass(row.status_cliente)}">${e(row.status_cliente)}</span></td><td><div class="primary-cell"><strong>${e(contact.nome || '—')}</strong><small>${e(contact.email || contact.telefone || '')}</small></div></td><td>${row.vagas_abertas || 0}</td><td class="align-right"><button class="button button-ghost" onclick="editClient('${a(row.cliente_id)}')">Editar</button></td></tr>`;
    }).join('') : empty('Nenhum cliente cadastrado.');
  }
  async function loadJobs() {
    tableBusy('jobs-body', 'Carregando vagas…');
    App.jobs = await server('mvpGetJobs');
    App.cache.jobs = Date.now();
    renderJobs();
  }
  function renderJobs() {
    $('jobs-body').innerHTML = App.jobs.length ? App.jobs.map(row => `<tr><td><div class="primary-cell"><strong>${e(row.titulo_vaga)}</strong><small>${e(row.area_vaga || '')}</small></div></td><td>${e(row.nome_empresa)}</td><td><span class="status-badge ${statusClass(row.status_vaga)}">${e(row.status_vaga)}</span></td><td>${row.qtd_posicoes || 1}</td><td>${row.indicacoes_ativas || 0}</td><td class="align-right"><button class="button button-ghost" onclick="editJob('${a(row.vaga_id)}')">Editar</button></td></tr>`).join('') : empty('Nenhuma vaga cadastrada.');
  }
  async function loadIndications() {
    tableBusy('indications-body', 'Carregando indicações…');
    App.indications = await server('mvpGetIndications');
    renderIndications();
  }
  function renderIndications() {
    $('indications-body').innerHTML = App.indications.length ? App.indications.map(row => `<tr><td>${e(row.nome_talento)}</td><td>${e(row.titulo_vaga)}</td><td>${e(row.nome_empresa)}</td><td><span class="status-badge ${statusClass(row.status_indicacao)}">${e(row.status_indicacao)}</span></td><td>${date(row.atualizado_em)}</td><td class="align-right">${['Contratado', 'Liberado'].includes(row.status_indicacao) ? '—' : `<button class="button button-ghost" onclick="changeStatus('${a(row.indicacao_id)}')">Atualizar</button>`}</td></tr>`).join('') : empty('Nenhuma indicação registrada.');
  }
  async function loadAudit() {
    tableBusy('audit-body', 'Carregando histórico…');
    const rows = await server('getAuditLogs', { limit: 100 }); $('audit-body').innerHTML = rows.length ? rows.map(row => `<tr><td>${date(row.data_evento)}</td><td>${e(row.usuario || '—')}</td><td>${e(row.acao)}</td><td>${e(row.entidade)}</td><td>${e(row.observacao || row.campo_alterado || '—')}</td></tr>`).join('') : empty('Nenhuma alteração registrada.');
  }
  async function openDialog(id) {
    busy(true, 'Preparando formulário…');
    try {
      if (id === 'client-dialog') { reset($('client-form')); $('client-dialog-title').textContent = 'Novo cliente'; }
      if (id === 'job-dialog') {
        reset($('job-form'));
        if (!fresh('clients')) { App.clients = await server('mvpGetClients'); App.cache.clients = Date.now(); }
        fillOptions('job-client', App.clients, 'cliente_id', 'nome_empresa');
      }
      if (id === 'indication-dialog') {
        reset($('indication-form'));
        const [jobs, talents] = await Promise.all([
          fresh('jobs') ? App.jobs : server('mvpGetJobs'),
          fresh('availableTalents') ? App.availableTalents : server('mvpGetAvailableTalents')
        ]);
        App.jobs = jobs; App.availableTalents = talents; App.cache.jobs = Date.now(); App.cache.availableTalents = Date.now();
        fillOptions('indication-job', App.jobs.filter(job => ['Aberta', 'Em processo'].includes(job.status_vaga)), 'vaga_id', job => `${job.titulo_vaga} · ${job.nome_empresa}`);
        fillOptions('indication-talent', App.availableTalents, 'pessoa_id', talent => `${talent.nome} · ${talent.area_interesse_principal || 'sem área'}`);
      }
      $(id).showModal();
    } catch (error) { toast(error.message, true); }
    finally { busy(false); }
  }
  function editTalent(id) { const row = App.talents.find(item => item.pessoa_id === id); if (!row) return; fillForm($('talent-form'), row); $('talent-name').textContent = row.nome; $('talent-dialog').showModal(); }
  function editClient(id) { const row = App.clients.find(item => item.cliente_id === id); if (!row) return; reset($('client-form')); fillForm($('client-form'), row); const contact = row.contato_principal || {}; fillForm($('client-form'), { contato_id: contact.contato_id, contato_nome: contact.nome, contato_cargo: contact.cargo, contato_email: contact.email, contato_telefone: contact.telefone }); $('client-dialog-title').textContent = 'Editar cliente'; $('client-dialog').showModal(); }
  async function editJob(id) {
    const row = App.jobs.find(item => item.vaga_id === id); if (!row) return;
    busy(true, 'Preparando vaga…');
    try {
      if (!fresh('clients')) { App.clients = await server('mvpGetClients'); App.cache.clients = Date.now(); }
      fillOptions('job-client', App.clients, 'cliente_id', 'nome_empresa'); fillForm($('job-form'), row); $('job-dialog-title').textContent = 'Editar vaga'; $('job-dialog').showModal();
    } catch (error) { toast(error.message, true); }
    finally { busy(false); }
  }
  function changeStatus(id) { const row = App.indications.find(item => item.indicacao_id === id); const next = { 'Em análise': ['Enviado', 'Liberado'], Enviado: ['Entrevista', 'Liberado'], Entrevista: ['Contratado', 'Liberado'] }[row.status_indicacao] || []; $('status-dialog-title').textContent = `${row.nome_talento} · ${row.titulo_vaga}`; $('status-form').elements.indicacao_id.value = id; $('status-form').elements.observacoes.value = row.observacoes || ''; $('status-select').innerHTML = next.map(value => `<option>${value}</option>`).join(''); $('status-dialog').showModal(); }
  async function saveTalent(event) {
    event.preventDefault();
    await saveAndReload(event.currentTarget, 'mvpSaveTalent', 'Perfil atualizado.', 'talent-dialog', loadTalents, 'Salvando perfil…');
    App.cache.availableTalents = 0;
  }
  async function saveClient(event) {
    event.preventDefault(); const form = event.currentTarget; const payload = object(form);
    busy(true, 'Salvando cliente…'); formBusy(form, true, 'Salvando…');
    try {
      const saved = await server('mvpSaveClientWithContact', payload);
      upsert(App.clients, saved, 'cliente_id');
      App.cache.clients = Date.now();
      $('client-dialog').close(); renderClients(); toast('Cliente salvo.');
    } catch (error) { toast(error.message, true); }
    finally { formBusy(form, false); busy(false); }
  }
  async function saveJob(event) {
    event.preventDefault(); const form = event.currentTarget;
    busy(true, 'Salvando vaga…'); formBusy(form, true, 'Salvando…');
    try {
      const saved = await server('mvpSaveJob', object(form));
      saved.nome_empresa = (App.clients.find(item => item.cliente_id === saved.cliente_id) || {}).nome_empresa || saved.nome_empresa || '';
      saved.indicacoes_ativas = (App.jobs.find(item => item.vaga_id === saved.vaga_id) || {}).indicacoes_ativas || 0;
      upsert(App.jobs, saved, 'vaga_id'); App.cache.jobs = Date.now();
      $('job-dialog').close(); renderJobs(); toast('Vaga salva.');
    } catch (error) { toast(error.message, true); }
    finally { formBusy(form, false); busy(false); }
  }
  async function saveIndication(event) {
    event.preventDefault(); const form = event.currentTarget; const payload = object(form);
    busy(true, 'Criando indicação…'); formBusy(form, true, 'Criando…');
    try {
      const saved = await server('mvpCreateIndication', payload);
      const talent = App.availableTalents.find(item => item.pessoa_id === payload.pessoa_id) || {};
      const job = App.jobs.find(item => item.vaga_id === payload.vaga_id) || {};
      saved.nome_talento = saved.nome_talento || talent.nome || '';
      saved.titulo_vaga = saved.titulo_vaga || job.titulo_vaga || '';
      saved.nome_empresa = saved.nome_empresa || job.nome_empresa || '';
      upsert(App.indications, saved, 'indicacao_id');
      App.availableTalents = App.availableTalents.filter(item => item.pessoa_id !== payload.pessoa_id);
      if (job.vaga_id) { job.status_vaga = 'Em processo'; job.indicacoes_ativas = Number(job.indicacoes_ativas || 0) + 1; }
      App.cache.availableTalents = Date.now(); App.cache.jobs = Date.now();
      $('indication-dialog').close(); renderIndications(); toast('Indicação criada.');
    } catch (error) { toast(error.message, true); }
    finally { formBusy(form, false); busy(false); }
  }
  async function saveStatus(event) {
    event.preventDefault(); const form = event.currentTarget;
    busy(true, 'Atualizando indicação…'); formBusy(form, true, 'Atualizando…');
    try {
      const result = await server('mvpUpdateIndication', form.elements.indicacao_id.value, form.elements.status_indicacao.value, form.elements.observacoes.value);
      [result.indication].concat(result.related || []).filter(Boolean).forEach(update => {
        const row = App.indications.find(item => item.indicacao_id === update.indicacao_id);
        if (row) Object.assign(row, update);
      });
      if (result.job) {
        const job = App.jobs.find(item => item.vaga_id === result.job.vaga_id);
        if (job) Object.assign(job, result.job);
      }
      App.cache.availableTalents = 0; App.cache.jobs = 0;
      form.closest('dialog').close(); renderIndications(); toast('Indicação atualizada.');
    } catch (error) { toast(error.message, true); }
    finally { formBusy(form, false); busy(false); }
  }
  async function saveAndReload(form, method, message, dialogId, reload, loadingMessage) {
    busy(true, loadingMessage || 'Salvando…'); formBusy(form, true, 'Salvando…');
    try {
      await server(method, object(form)); $(dialogId).close(); toast(message); await reload();
    } catch (error) { toast(error.message, true); }
    finally { formBusy(form, false); busy(false); }
  }
  function fillOptions(id, rows, value, label) { $(id).innerHTML = `<option value="">Selecione</option>` + rows.map(row => `<option value="${a(row[value])}">${e(typeof label === 'function' ? label(row) : row[label])}</option>`).join(''); }
  function fillForm(form, data) { [...form.elements].forEach(field => { if (field.name && data[field.name] != null) field.value = data[field.name]; }); }
  function reset(form) { form.reset(); form.querySelectorAll('input[type=hidden]').forEach(field => field.value = ''); }
  function object(form) { return Object.fromEntries(new FormData(form).entries()); }
  function busy(on, message) {
    App.loadingCount = Math.max(0, App.loadingCount + (on ? 1 : -1));
    $('loading-overlay').classList.toggle('hidden', App.loadingCount === 0);
    document.body.classList.toggle('app-busy', App.loadingCount > 0);
    if (message) $('loading-message').textContent = message;
  }
  function formBusy(form, on, label) {
    const button = form.querySelector('button[type="submit"], button:not([type])');
    if (!button) return;
    if (on) {
      button.dataset.idleLabel = button.textContent;
      button.textContent = label || 'Processando…';
    } else if (button.dataset.idleLabel) {
      button.textContent = button.dataset.idleLabel;
    }
    button.disabled = on; button.classList.toggle('is-loading', on);
  }
  function tableBusy(id, message) { $(id).innerHTML = `<tr><td colspan="6" class="table-loading"><span>${e(message)}</span></td></tr>`; }
  function fresh(key) { return Boolean(App.cache[key] && Date.now() - App.cache[key] < 60000); }
  function upsert(rows, value, key) {
    const index = rows.findIndex(item => String(item[key]) === String(value[key]));
    if (index === -1) rows.unshift(value); else rows[index] = Object.assign({}, rows[index], value);
  }
  async function runInline(loader) {
    try { await loader(); } catch (error) { restoreRoute(App.route); toast(error.message, true); }
  }
  function restoreRoute(name) {
    if (name === 'talentos') renderTalents();
    else if (name === 'clientes') renderClients();
    else if (name === 'vagas') renderJobs();
    else if (name === 'indicacoes') renderIndications();
    else if (name === 'audit') $('audit-body').innerHTML = empty('Não foi possível carregar o histórico.');
  }
  function toast(message, error) { const node = document.createElement('div'); node.className = 'toast' + (error ? ' error' : ''); node.textContent = message; $('toast-region').append(node); setTimeout(() => node.remove(), 4000); }
  function alertGlobal(message) { $('global-alert').textContent = message; $('global-alert').classList.remove('hidden'); }
  function empty(message) { return `<tr><td colspan="6" class="empty-cell">${e(message)}</td></tr>`; }
  function statusClass(value) { value = String(value || '').toLowerCase(); return /(disponível|ativo|aberta|contratado|preenchida)/.test(value) ? 'status-positive' : /(processo|análise|enviado|entrevista)/.test(value) ? 'status-info' : /(rascunho|prospect)/.test(value) ? 'status-warning' : 'status-negative'; }
  function date(value) { return value ? new Date(value).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—'; }
  function e(value) { return String(value == null ? '' : value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char])); }
  function a(value) { return e(value).replace(/'/g, '&#39;'); }
  function debounce(fn, wait) { let timer; return () => { clearTimeout(timer); timer = setTimeout(fn, wait); }; }
</script>
